name: Bug report
description: Report incorrect output, a crash, or another reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Locator Color Finder. Do not include account credentials, access tokens, or private datasets.

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `locator-color-finder --version` or provide the commit hash.
      placeholder: locator-color-finder 0.1.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command, removing personal filesystem paths if necessary.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction details
      description: Include whether you used the pinned snapshot or a custom CSV, but do not upload a private dataset.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and other private information.
          required: true

