name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "version = \"${version}\"" Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Validate source
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: locator-color-finder.exe
            archive: locator-color-finder-windows-x86_64.zip
            package_shell: pwsh
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: locator-color-finder
            archive: locator-color-finder-linux-x86_64.tar.gz
            package_shell: bash
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: locator-color-finder
            archive: locator-color-finder-macos-x86_64.tar.gz
            package_shell: bash
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: locator-color-finder
            archive: locator-color-finder-macos-aarch64.tar.gz
            package_shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows archive
        if: matrix.package_shell == 'pwsh'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix archive
        if: matrix.package_shell == 'bash'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" staging/
          cp README.md LICENSE staging/
          tar -C staging -czf "${{ matrix.archive }}" .

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum locator-color-finder-* > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
